# Hosted control plane: app + Postgres. Copy .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: media_admin
      POSTGRES_USER: media_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_admin -d media_admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://media_admin:${PG_PASSWORD}@db/media_admin
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TVDB_API_KEY: ${TVDB_API_KEY:-}
    ports:
      - "127.0.0.1:8095:8095"   # nginx proxies to this; never expose directly
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
